# Local dev stack. Change the PHP version by editing the two image tags below.
#   docker compose up -d                      -> http://localhost:8080
#   docker compose run --rm cli <wp-cli args> -> e.g. `plugin list`
# Drop a .sql dump into ./db/ before the first `up` to auto-import it.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro

  wordpress:
    image: wordpress:php8.5-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      FREE_OCR_API_KEY: ${FREE_OCR_API_KEY:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FREE_OCR_API_KEY', getenv('FREE_OCR_API_KEY'));
    volumes: &wp_volumes
      - wp_core:/var/www/html
      - ./wp-content/themes/portfolio:/var/www/html/wp-content/themes/portfolio
      - ./wp-content/plugins:/var/www/html/wp-content/plugins

  cli:
    image: wordpress:cli-php8.5
    profiles: ["cli"]
    depends_on:
      - db
    user: "33:33"
    environment: *wp_env
    volumes: *wp_volumes

volumes:
  db_data:
  wp_core:
